<section class="scatter glass">
  <header class="scatter-header">
    <h3 class="section-label">{{ 'SESSION_COMPARE.SECTION_EFFICIENCY' | translate }}</h3>
    <p class="scatter-hint">{{ 'SESSION_COMPARE.SCATTER_HINT' | translate }}</p>
  </header>

  <div class="legend">
    @for (s of sessions; track s.id; let i = $index) {
      <span class="legend-item">
        <span class="swatch" [style.background]="colors[i]"></span>
        {{ s.title }}
      </span>
    }
  </div>

  <canvas #canvas class="scatter-canvas"></canvas>
</section>
