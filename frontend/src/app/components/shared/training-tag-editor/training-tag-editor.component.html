<div class="tag-editor" [class.editing]="editing" [class.readonly]="readonly">
  <div class="chips">
    @for (tag of _tags; track tag; let i = $index) {
      <span class="chip">
        <span class="chip-hash">#</span>{{ tag }}
        @if (!readonly) {
          <button
            type="button"
            class="chip-remove"
            [attr.aria-label]="'Remove tag ' + tag"
            (click)="removeAt(i)"
          >
            ×
          </button>
        }
      </span>
    }
    @if (!readonly && !editing) {
      <button type="button" class="add-chip" (click)="startEditing()">
        <span aria-hidden="true">+</span>
        <span>{{
          (_tags.length ? 'TRAINING_TAGS.ADD' : 'TRAINING_TAGS.ADD_FIRST') | translate
        }}</span>
      </button>
    }
    @if (editing) {
      <span class="chip-input-wrap">
        <input
          #input
          class="chip-input"
          type="text"
          maxlength="32"
          [(ngModel)]="draft"
          (ngModelChange)="onInput()"
          (keydown)="onKey($event)"
          (blur)="onBlur()"
          [placeholder]="'TRAINING_TAGS.PLACEHOLDER' | translate"
        />
        <button
          type="button"
          class="chip-confirm"
          [attr.aria-label]="'TRAINING_TAGS.CONFIRM' | translate"
          [disabled]="!draft.trim()"
          (mousedown)="confirmDraft($event)"
        >
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 12.5l4.5 4.5L19 7.5"
            />
          </svg>
        </button>
      </span>
    }
  </div>

  @if (editing && suggestions.length) {
    <div class="suggestions" role="listbox">
      @for (s of suggestions; track s) {
        <button type="button" class="suggestion" (mousedown)="pickSuggestion(s)">#{{ s }}</button>
      }
    </div>
  }
</div>
