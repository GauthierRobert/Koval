openapi: 3.1.0
info:
  title: Training Planner - Strava Integration API
  version: 1.0.0
  description: Strava activity sync and FIT file generation.

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

paths:
  /api/integration/strava/import-history:
    post:
      operationId: importStravaHistory
      summary: Backfill Strava activities from before the Strava link as completed sessions
      description: >
        Imports activities from the last `days` days (clamped to 1-90) that predate the
        Strava connection — activities since the link arrive via webhook. Ranges covered
        by a previous import are skipped, so re-clicking the same range fetches nothing.
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 90
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /api/integration/strava/status:
    get:
      operationId: getStravaStatus
      summary: Get Strava sync status (connected, last sync time)
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"

  /api/integration/strava/sessions/{sessionId}/build-fit:
    post:
      operationId: buildFitFromStrava
      summary: Build a FIT file from a Strava-synced session's stream data
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session with generated FIT file
          content:
            application/json:
              schema:
                type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SyncResult:
      type: object
      properties:
        totalFetched:
          type: integer
        newlyImported:
          type: integer
        skippedDuplicates:
          type: integer
        skippedErrors:
          type: integer
        importedSessions:
          type: array
          items:
            type: object

    SyncStatus:
      type: object
      properties:
        stravaConnected:
          type: boolean
        lastSyncAt:
          type: string
          format: date-time
        memberSince:
          type: string
          format: date-time
