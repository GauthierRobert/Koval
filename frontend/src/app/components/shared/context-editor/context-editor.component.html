<div class="context-editor">
  @for (title of displayTitles; track title) {
    <div class="form-group">
      <label class="field-label" [attr.for]="'ctx-' + title">{{ title }}</label>
      <textarea
        class="field-textarea"
        [id]="'ctx-' + title"
        [(ngModel)]="model[title]"
        [ngModelOptions]="{ standalone: true }"
        [readonly]="readonly"
        [disabled]="saving"
        rows="3"
        [placeholder]="readonly ? '' : ('CONTEXT.SECTION_PLACEHOLDER' | translate)"
      ></textarea>
    </div>
  }

  @if (readonly) {
    @if (!hasContent) {
      <p class="context-empty">{{ 'CONTEXT.ATHLETE_EMPTY' | translate }}</p>
    }
  } @else {
    <div class="context-actions">
      <span class="context-updated">
        @if (updatedAt) {
          {{ 'CONTEXT.LAST_UPDATED' | translate }}: {{ updatedAt | date: 'medium' }}
        } @else {
          {{ 'CONTEXT.NEVER_SAVED' | translate }}
        }
      </span>
      <button type="button" class="context-save-btn" [disabled]="saving" (click)="onSave()">
        {{ (saving ? 'CONTEXT.SAVING' : 'CONTEXT.SAVE') | translate }}
      </button>
    </div>
  }
</div>
