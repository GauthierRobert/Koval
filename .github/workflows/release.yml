name: Release backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  release:
    name: Bump pom version, tag, and publish release
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: bump
        working-directory: backend
        run: |
          BUMP="${{ github.event.inputs.bump || 'patch' }}"
          CURRENT=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)
          RELEASE="${CURRENT%-SNAPSHOT}"
          IFS='.' read -r MAJ MIN PAT <<< "$RELEASE"
          case "$BUMP" in
            major) MAJ=$((MAJ+1)); MIN=0; PAT=0 ;;
            minor) MIN=$((MIN+1)); PAT=0 ;;
            patch) PAT=$((PAT+1)) ;;
          esac
          NEXT_SNAPSHOT="$MAJ.$MIN.$PAT-SNAPSHOT"
          echo "current=$CURRENT"             >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE"             >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE"                >> "$GITHUB_OUTPUT"
          echo "next_snapshot=$NEXT_SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Set release version, commit, tag
        working-directory: backend
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.bump.outputs.release }}" -DgenerateBackupPoms=false
          cd ..
          git add backend/pom.xml
          git commit -m "chore(release): backend ${{ steps.bump.outputs.tag }}"
          git tag -a "backend-${{ steps.bump.outputs.tag }}" -m "Backend release ${{ steps.bump.outputs.tag }}"

      - name: Bump back to next SNAPSHOT
        working-directory: backend
        run: |
          mvn -B versions:set -DnewVersion="${{ steps.bump.outputs.next_snapshot }}" -DgenerateBackupPoms=false
          cd ..
          git add backend/pom.xml
          git commit -m "chore(release): start ${{ steps.bump.outputs.next_snapshot }}"

      - name: Push commits and tag
        run: |
          git push origin HEAD:main
          git push origin "backend-${{ steps.bump.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-${{ steps.bump.outputs.tag }}
          name: Backend ${{ steps.bump.outputs.tag }}
          generate_release_notes: true

      - name: Open PR to sync main → dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          BRANCH="release-sync/backend-${TAG}"
          git checkout -b "$BRANCH" origin/main
          git push origin "$BRANCH"
          PR_URL=$(gh pr create \
            --base dev \
            --head "$BRANCH" \
            --title "chore: sync backend ${TAG} release back into dev" \
            --body "Auto-generated by the release workflow. Brings the version bump commits (\`${TAG}\` release + next-SNAPSHOT) from \`main\` back into \`dev\` so future PRs don't conflict on \`backend/pom.xml\`. Safe to merge as-is.")
          echo "Opened $PR_URL"
          gh pr merge "$PR_URL" --auto --merge || \
            echo "::warning::Could not enable auto-merge — likely conflicts or auto-merge disabled in repo settings. Resolve manually at $PR_URL"
